<!doctype html><html lang="ko"><meta charset="utf-8">
<title>Abstraction 콘솔</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* 베이스 토큰은 orca 와 동일 (shadcn/ui neutral). 여기에 마스코트용 포인트 색만 얹는다. */
:root{
  --background:#fff; --foreground:#0a0a0a;
  --card:#fff; --card-foreground:#0a0a0a;
  --primary:#171717; --primary-foreground:#fafafa;
  --secondary:#f5f5f5; --secondary-foreground:#171717;
  --muted:#f5f5f5; --muted-foreground:#737373;
  --accent:#f5f5f5; --accent-foreground:#171717;
  --destructive:#e7000b;
  --border:#e5e5e5; --input:#e5e5e5; --ring:#a1a1a1;
  --sidebar:#fafafa; --sidebar-foreground:#0a0a0a; --sidebar-border:#e5e5e5;
  --sidebar-accent:#f5f5f5; --sidebar-accent-foreground:#171717;
  --ok:#00784a; --warn:#a35200;
  /* Hebi — 뱀(へび) 에서 딴 포인트 색 */
  --hebi:#10b981; --hebi-2:#a7f3d0; --hebi-deep:#047857; --hebi-blush:#fb7185;
  --gold:#d4a017; --silver:#8e9099; --bronze:#a9713b;
  --radius:.625rem;
  --radius-sm:calc(var(--radius) * .6); --radius-md:calc(var(--radius) * .8);
  --sidebar-width:232px; --rail:58px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --background:#0a0a0a; --foreground:#fafafa;
  --card:#171717; --card-foreground:#fafafa;
  --primary:#e5e5e5; --primary-foreground:#171717;
  --secondary:#262626; --secondary-foreground:#fafafa;
  --muted:#262626; --muted-foreground:#a1a1a1;
  --accent:#262626; --accent-foreground:#fafafa;
  --destructive:#ff6467;
  --border:#ffffff12; --input:#ffffff1a; --ring:#525252;
  --sidebar:#171717; --sidebar-foreground:#fafafa; --sidebar-border:#ffffff12;
  --sidebar-accent:#262626; --sidebar-accent-foreground:#fafafa;
  --ok:#00d492; --warn:#ffb900;
  --hebi:#34d399; --hebi-2:#065f46; --hebi-deep:#6ee7b7; --hebi-blush:#fb7185;
  --gold:#facc15; --silver:#cbd5e1; --bronze:#d99a5b;
  color-scheme:dark;
}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:var(--background);color:var(--foreground);
  font:14px/1.55 ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic',sans-serif;
  -webkit-font-smoothing:antialiased}
.app{display:flex;height:100vh}

/* ── 사이드바 ── */
.sidebar{width:var(--sidebar-width);flex:0 0 var(--sidebar-width);background:var(--sidebar);
  color:var(--sidebar-foreground);border-right:1px solid var(--sidebar-border);
  display:flex;flex-direction:column;padding:12px 10px;height:100vh;
  transition:width .2s cubic-bezier(.4,0,.2,1),flex-basis .2s cubic-bezier(.4,0,.2,1)}
.app.rail .sidebar{width:var(--rail);flex-basis:var(--rail);padding:12px 8px}
.brand{display:flex;align-items:center;gap:9px;padding:4px 6px 12px}
.logo{width:26px;height:26px;border-radius:var(--radius-sm);background:var(--primary);
  color:var(--primary-foreground);display:grid;place-items:center;font-weight:800;font-size:13px;
  flex:0 0 26px;overflow:hidden}
.logo.img{background:var(--secondary);border:1px solid var(--border)}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.brand b{font-size:13.5px;font-weight:650;letter-spacing:-.01em;display:block}
.brand span{display:block;font-size:11px;color:var(--muted-foreground);font-weight:400}
.brandtext{min-width:0;overflow:hidden;white-space:nowrap;flex:1}
.toggle{width:26px;height:26px;flex:0 0 26px;padding:0;border-radius:var(--radius-sm);
  background:transparent;color:var(--muted-foreground);border:1px solid transparent;
  display:grid;place-items:center;cursor:pointer}
.toggle:hover{background:var(--sidebar-accent);color:var(--foreground)}
.toggle svg{width:15px;height:15px;transition:transform .2s ease}
.app.rail .toggle svg{transform:rotate(180deg)}

nav{overflow-y:auto;overflow-x:hidden;flex:1;margin:0 -2px;padding:0 2px}
.navlink{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:var(--radius-md);
  color:var(--muted-foreground);text-decoration:none;font-size:13.5px;font-weight:500;
  margin-bottom:1px;white-space:nowrap;overflow:hidden;cursor:pointer;
  border:0;background:transparent;width:100%;
  transition:background .13s ease,color .13s ease}
.navlink:hover{background:var(--sidebar-accent);color:var(--sidebar-accent-foreground);opacity:1}
.navlink.on{background:var(--sidebar-accent);color:var(--sidebar-accent-foreground);font-weight:650}
.navlink svg{width:16px;height:16px;flex:0 0 16px;opacity:.85}
.navlink .lbl{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis}
.navlink .caret{width:13px;height:13px;flex:0 0 13px;opacity:.6;
  transition:transform .2s cubic-bezier(.4,0,.2,1)}
.navgroup.open > .navlink .caret{transform:rotate(90deg)}
.subnav{overflow:hidden;max-height:0;transition:max-height .22s cubic-bezier(.4,0,.2,1)}
.navgroup.open .subnav{max-height:220px}
.subnav a{display:flex;align-items:center;gap:9px;padding:6px 9px 6px 16px;
  margin:1px 0 1px 12px;border-left:1px solid var(--border);border-radius:0 var(--radius-md) var(--radius-md) 0;
  color:var(--muted-foreground);text-decoration:none;font-size:13px;white-space:nowrap;
  transition:background .13s ease,color .13s ease,border-color .13s ease}
.subnav a:hover{background:var(--sidebar-accent);color:var(--sidebar-accent-foreground)}
.subnav a.on{color:var(--sidebar-accent-foreground);font-weight:650;
  border-left-color:var(--hebi);background:var(--sidebar-accent)}
.subnav a svg{width:14px;height:14px;flex:0 0 14px;opacity:.8}
.app.rail .navlink .lbl,.app.rail .navlink .caret,.app.rail .brandtext,
.app.rail .bubble,.app.rail .stat{display:none}
.app.rail .navlink{justify-content:center;padding:8px 0}
.app.rail .subnav{max-height:0!important}

/* ── Hebi ── */
.hebi{padding-top:10px}
.bubble{position:relative;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:8px 11px;font-size:12px;line-height:1.45;
  margin-bottom:9px;min-height:34px;animation:fadein .25s ease}
.bubble:after{content:"";position:absolute;left:24px;bottom:-6px;width:10px;height:10px;
  background:var(--card);border-right:1px solid var(--border);border-bottom:1px solid var(--border);
  transform:rotate(45deg)}
.hebiwrap{display:flex;align-items:flex-end;gap:9px}
.app.rail .hebiwrap{justify-content:center}
.hebiart{width:52px;height:52px;flex:0 0 52px;position:relative}
.app.rail .hebiart{width:38px;height:38px;flex-basis:38px}
.hebiart svg{width:100%;height:100%;display:block;object-fit:contain}
.hebiart img{width:100%;height:100%;display:block;object-fit:cover;border-radius:9999px}
.hebihero{width:76px;height:76px;margin:0 auto 14px;animation:bob 3.4s ease-in-out infinite}
.hebihero svg,.hebihero img{width:100%;height:100%;display:block}
.hebihero img{object-fit:cover;border-radius:9999px;border:1px solid var(--border)}
.hebiart.bob{animation:bob 3.4s ease-in-out infinite}
.hebiart.spin:before{content:"";position:absolute;inset:-4px;border-radius:50%;
  border:2px solid transparent;border-top-color:var(--hebi);animation:spin .9s linear infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-4px) rotate(1.5deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.stat{font-size:11.5px;color:var(--muted-foreground);line-height:1.5;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;
  background:var(--muted-foreground);vertical-align:1px}
.dot.live{background:var(--ok);animation:pulse 2s ease-in-out infinite}
.dot.off{background:var(--warn)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}
  70%{box-shadow:0 0 0 5px transparent}}

/* ── 본문 ── */
.main{flex:1;min-width:0;height:100vh;overflow-y:auto;padding:30px 40px 60px}
.main .inner{max-width:900px}
.main.full{overflow:hidden;display:flex;flex-direction:column;padding-bottom:22px}
.main.full .inner{max-width:1080px;flex:1;display:flex;flex-direction:column;min-height:0;width:100%}
.head{margin-bottom:20px}
.head h1{font-size:21px;font-weight:650;letter-spacing:-.02em}
.head p{color:var(--muted-foreground);font-size:13.5px;margin-top:3px}
#view{animation:viewin .22s ease}
@keyframes viewin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.main.full #view{flex:1;display:flex;flex-direction:column;min-height:0}
h2{font-size:12px;font-weight:600;color:var(--muted-foreground);text-transform:uppercase;
  letter-spacing:.07em;margin:26px 0 9px}
h2:first-child{margin-top:0}

.card{background:var(--card);color:var(--card-foreground);border:1px solid var(--border);
  border-radius:var(--radius);padding:13px 15px;margin-bottom:8px;display:flex;
  align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  transition:border-color .14s ease;animation:fadein .22s ease}
.card:hover{border-color:color-mix(in srgb,var(--hebi) 40%,var(--border))}
.card>div:first-child{min-width:0;flex:1}
.lead{display:flex;align-items:center;gap:11px;min-width:0;flex:1}
.svc{width:28px;height:28px;flex:0 0 28px;border-radius:var(--radius-sm);overflow:hidden;
     display:grid;place-items:center;background:var(--secondary);border:1px solid var(--border)}
.svc img{width:19px;height:19px;object-fit:contain;display:block}
.svc.letter{font-weight:700;font-size:13px;color:var(--muted-foreground)}
.who{font-weight:550;font-size:14px;letter-spacing:-.005em}
.meta{color:var(--muted-foreground);font-size:12.5px;margin-top:1px}
.ok{color:var(--ok);font-weight:600} .warn{color:var(--warn);font-weight:600}
.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;
  padding:1px 7px;border-radius:9999px;border:1px solid var(--border);
  background:var(--secondary);color:var(--secondary-foreground);vertical-align:1px}
.badge.g{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent);
  background:color-mix(in srgb,var(--ok) 10%,transparent)}
.badge.y{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent);
  background:color-mix(in srgb,var(--warn) 10%,transparent)}

button{font:inherit;font-weight:550;font-size:13.5px;padding:7px 14px;border:1px solid transparent;
  border-radius:var(--radius-md);background:var(--primary);color:var(--primary-foreground);
  cursor:pointer;transition:opacity .12s ease,background .12s ease,transform .1s ease;
  white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
button:hover{opacity:.88} button:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
button.ghost{background:transparent;color:var(--foreground);border-color:var(--border)}
button.ghost:hover{background:var(--accent);opacity:1}
button.danger{background:transparent;color:var(--destructive);
  border-color:color-mix(in srgb,var(--destructive) 32%,transparent)}
button.danger:hover{background:color-mix(in srgb,var(--destructive) 9%,transparent);opacity:1}
input,select{font:inherit;font-size:13.5px;padding:6.5px 10px;border-radius:var(--radius-md);
  border:1px solid var(--input);background:var(--background);color:var(--foreground);max-width:100%}
input:focus,select:focus{outline:2px solid color-mix(in srgb,var(--hebi) 45%,transparent);
  outline-offset:1px;border-color:var(--hebi)}
input::placeholder{color:var(--muted-foreground)}
label.f{font-size:12.5px;color:var(--muted-foreground);display:flex;gap:6px;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.chip{border:1px solid var(--border);border-radius:9999px;padding:3.5px 12px;font-size:12.5px;
  cursor:pointer;color:var(--muted-foreground);background:var(--background);user-select:none;
  transition:background .12s ease,color .12s ease,transform .1s ease}
.chip:hover{background:var(--accent);color:var(--accent-foreground)}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}

/* ── 로딩 ── */
.spin{width:14px;height:14px;border:2px solid color-mix(in srgb,currentColor 25%,transparent);
  border-top-color:currentColor;border-radius:50%;animation:spin .75s linear infinite;
  display:inline-block;flex:0 0 14px}
.sk{background:linear-gradient(90deg,var(--muted) 25%,var(--accent) 37%,var(--muted) 63%);
  background-size:400% 100%;animation:shimmer 1.3s ease infinite;border-radius:var(--radius-sm);
  height:13px}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
.skcard{border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px;
  margin-bottom:8px;display:flex;gap:12px;align-items:center}
.busy{display:flex;align-items:center;gap:9px;color:var(--muted-foreground);
  font-size:13px;padding:26px 0;justify-content:center}
.prog{height:5px;border-radius:9999px;background:var(--muted);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;border-radius:9999px;
  background:linear-gradient(90deg,var(--hebi),var(--hebi-deep));
  background-size:200% 100%;animation:flow 1.3s linear infinite;width:100%}
@keyframes flow{to{background-position:-200% 0}}
.think{display:inline-flex;gap:3px;align-items:center;vertical-align:2px}
.think i{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.35;
  animation:blink 1.2s ease-in-out infinite}
.think i:nth-child(2){animation-delay:.18s} .think i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
.caret2{display:inline-block;width:2px;height:1em;background:var(--hebi);
  vertical-align:-2px;margin-left:1px;animation:cblink 1s step-end infinite}
@keyframes cblink{50%{opacity:0}}

.log{white-space:pre-wrap;background:var(--muted);border:1px solid var(--border);
  border-radius:var(--radius);padding:11px 13px;margin-top:10px;color:var(--muted-foreground);
  font:12px/1.6 ui-monospace,'Cascadia Mono',Consolas,monospace;max-height:230px;overflow:auto;
  display:none}
a.big{display:inline-block;margin-top:9px;padding:7px 14px;background:var(--hebi);
  color:#04241a;border-radius:var(--radius-md);text-decoration:none;font-size:13.5px;font-weight:650}
.empty{color:var(--muted-foreground);padding:44px 0;text-align:center;font-size:13.5px}
.banner{border:1px solid color-mix(in srgb,var(--warn) 32%,transparent);
  background:color-mix(in srgb,var(--warn) 8%,transparent);color:var(--warn);
  border-radius:var(--radius);padding:9px 14px;margin-bottom:16px;font-size:13px;display:none;
  animation:fadein .22s ease}

/* ── 묻기: 화면 전체 ── */
#thread{flex:1;min-height:0;overflow-y:auto;padding:4px 2px 10px}
.turn{display:flex;gap:11px;margin-bottom:20px;align-items:flex-start;animation:fadein .22s ease}
.turn.me{justify-content:flex-end}
.turn .mark{width:26px;height:26px;flex:0 0 26px;border-radius:9999px;overflow:hidden;
  background:var(--secondary);border:1px solid var(--border);display:grid;place-items:center}
.turn .mark svg{width:100%;height:100%;object-fit:contain}
.turn .mark img{width:100%;height:100%;object-fit:cover}
.turn .body{min-width:0;font-size:14px;line-height:1.72;white-space:pre-wrap;word-break:break-word}
.turn.me .body{max-width:74%;background:var(--secondary);color:var(--secondary-foreground);
  border:1px solid var(--border);border-radius:var(--radius);padding:9px 14px}
.turn.hebi .body{flex:1;padding-top:2px}

/* 컴포저 — orca 처럼 상자 하나 안에 에디터와 툴바가 같이 들어간다 */
.composer{border:1px solid var(--input);border-radius:var(--radius);background:var(--card);
  padding:11px 13px 9px;transition:border-color .14s ease,box-shadow .14s ease}
.composer:focus-within{border-color:var(--hebi);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--hebi) 20%,transparent)}
.composer textarea{width:100%;border:0;outline:0;background:transparent;color:inherit;
  font:inherit;font-size:14.5px;line-height:1.62;resize:none;min-height:26px;max-height:210px;
  padding:0;display:block}
.composer textarea::placeholder{color:var(--muted-foreground)}
.ctoolbar{display:flex;align-items:center;gap:7px;margin-top:9px;flex-wrap:wrap}
.ctoolbar .grow{flex:1}
.ctoolbar select,.ctoolbar input[type=date]{font-size:12.5px;padding:4px 8px;
  border-radius:var(--radius-sm);border:1px solid var(--border);background:transparent;
  color:var(--muted-foreground)}
.ctoolbar .hint{font-size:11.5px;color:var(--muted-foreground)}
.sendbtn{width:32px;height:32px;flex:0 0 32px;padding:0;border-radius:9999px;
  display:grid;place-items:center;background:var(--primary);color:var(--primary-foreground)}
.sendbtn svg{width:16px;height:16px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}

#sum{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);
     padding:16px 18px;margin-top:10px;display:none;white-space:pre-wrap;font-size:13.5px;
     line-height:1.65;max-height:52vh;overflow:auto;animation:fadein .22s ease}
#sum h4{font-size:12px;color:var(--muted-foreground);text-transform:uppercase;
        letter-spacing:.06em;margin:0 0 10px;display:flex;gap:8px;align-items:center;
        justify-content:space-between}

/* 대화 뷰어 */
#stream{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);
  padding:4px 16px 16px;max-height:58vh;overflow:auto}
.day{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:10px;
  background:var(--card);padding:12px 0 7px;font-size:11.5px;font-weight:600;
  color:var(--muted-foreground)}
.day:before,.day:after{content:"";flex:1;height:1px;background:var(--border)}
.msg{display:flex;align-items:flex-start;gap:11px;padding:1px 6px;border-radius:var(--radius-sm)}
.msg:hover{background:var(--accent)}
.msg.head{margin-top:11px}
.av{width:30px;height:30px;border-radius:9999px;background:var(--secondary);
  color:var(--secondary-foreground);border:1px solid var(--border);flex:0 0 30px;
  display:grid;place-items:center;font-size:12.5px;font-weight:650}
.av.gap{background:transparent;border-color:transparent;height:0;min-height:0}
.bod{min-width:0;flex:1}
.nm{font-weight:650;font-size:13.5px}
.tm{color:var(--muted-foreground);font-size:11px;margin-left:7px;font-weight:400}
.tx{white-space:pre-wrap;word-break:break-word;font-size:13.5px}
.tag{display:inline-block;font-size:10.5px;font-weight:600;color:var(--muted-foreground);
  border:1px solid var(--border);border-radius:4px;padding:0 5px;margin-right:5px;vertical-align:1px}
.jump{float:right;color:var(--muted-foreground);font-size:11px;text-decoration:none;
  opacity:0;transition:opacity .12s}
.msg:hover .jump{opacity:1}
mark{background:color-mix(in srgb,var(--hebi) 35%,transparent);color:inherit;
  border-radius:3px;padding:0 1px}

/* 리더보드 */
table{width:100%;border-collapse:collapse;border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden}
th,td{text-align:left;padding:10px 13px;border-bottom:1px solid var(--border)}
thead th{font-size:11.5px;font-weight:600;color:var(--muted-foreground);background:var(--muted);
  text-transform:uppercase;letter-spacing:.05em}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--accent)}
td.n{text-align:right;font-variant-numeric:tabular-nums;font-size:13.5px}
.rank{width:46px;font-variant-numeric:tabular-nums;color:var(--muted-foreground);font-weight:650}
.medal{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:9999px;
  font-size:12px;font-weight:800;color:#1a1a1a}
.m1{background:var(--gold)} .m2{background:var(--silver)} .m3{background:var(--bronze)}
.bar{height:5px;background:var(--muted);border-radius:9999px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9999px;
  background:linear-gradient(90deg,var(--hebi),var(--hebi-deep));transition:width .5s ease}

@media (max-width:760px){
  html,body{overflow:auto}
  .app{flex-direction:column;height:auto}
  .sidebar{width:100%!important;flex:none!important;height:auto;border-right:0;
    border-bottom:1px solid var(--sidebar-border);padding:10px}
  .toggle{display:none}
  .navgroup .subnav{max-height:220px}

<script>
const AG = __AGENTS__, CATALOG = __MCP__, SELFMCP = __SELFMCP__, PRESET = __CODE__;
const $ = s => document.querySelector(s);
const el = (t, cls, html) => { const e=document.createElement(t); if(cls) e.className=cls;
  if(html!=null) e.innerHTML=html; return e; };
const esc = s => { const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; };
const ic = d => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" '+
  'stroke-linecap="round" stroke-linejoin="round">'+d+'</svg>';
const ICON = {
  chat: ic('<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>'),
  ask: ic('<path d="M12 17h.01"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><circle cx="12" cy="12" r="9.5"/>'),
  board: ic('<path d="M12 20V10M18 20V4M6 20v-4"/>'),
  manage: ic('<path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7.9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H2a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 3.7 7.9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H8a1.6 1.6 0 0 0 1-1.5V2a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V8a1.6 1.6 0 0 0 1.5 1H22a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>'),
  collect: ic('<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/>'+
              '<path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>'),
  digest: ic('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>'+
             '<path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/>'),
  connect: ic('<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.5 1.5"/>'+
              '<path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.5-1.5"/>'),
  mcp: ic('<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>'+
          '<rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'),
  me: ic('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'),
  gear: ic('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3'+
           'M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>'),
  chevron: ic('<path d="m15 18-6-6 6-6"/>'),
  right: ic('<path d="m9 18 6-6-6-6"/>'),
  arrow: ic('<path d="M12 19V5"/><path d="m5 12 7-7 7 7"/>'),
};
// 페이지 정의. group 이 있으면 사이드바에서 접히는 상위 탭 아래로 들어간다.
const PAGES = {
  chat:    {label:'대화', icon:ICON.chat, title:'대화 보기',
            sub:'수집된 채널의 대화를 날짜 범위로 보고 검색합니다.'},
  ask:     {label:'묻기', icon:ICON.ask, title:'묻기', full:1,
            sub:'고른 기간의 대화를 놓고 자유롭게 묻고 시킵니다.'},
  board:   {label:'리더보드', icon:ICON.board, title:'리더보드',
            sub:'수집된 채널 기준 발언 집계입니다.'},
  collect: {label:'수집 채널', icon:ICON.collect, title:'수집 채널', mgr:1,
            sub:'어떤 채널을 모을지 정하고 과거 대화를 가져옵니다.'},
  digest:  {label:'일일 결산', icon:ICON.digest, title:'일일 결산', mgr:1,
            sub:'매일 정한 시각에 전날 대화를 정리해 올립니다.'},
  connect: {label:'계정 연결', icon:ICON.connect, title:'계정 연결',
            sub:'에이전트 CLI 와 디스코드를 연결합니다.'},
  mcp:     {label:'MCP', icon:ICON.mcp, title:'MCP 연결',
            sub:'내 에이전트에 붙일 MCP 서버를 관리합니다.'},
  me:      {label:'내 설정', icon:ICON.me, title:'내 설정',
            sub:'내 메시지를 수집에서 뺄지 정합니다.'},
};
// 사이드바 구조. 배열이면 접히는 상위 탭.
const NAV = [
  'chat', 'ask', 'board',
  {id:'manage', label:'관리', icon:ICON.manage, mgr:1, items:['collect','digest']},
  {id:'setup',  label:'설정', icon:ICON.gear, items:['connect','mcp','me']},
];
let ME = {}, POLL = null, WATCH = null, REV = null, BUSY = 0, TYPING = null;

const today = () => new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
const ago = n => new Date(Date.now()+9*3600e3-n*86400e3).toISOString().slice(0,10);
const pref = (k,v) => { try{ return v===undefined ? localStorage.getItem('ab.'+k)
                                                  : localStorage.setItem('ab.'+k,v); }catch(e){} };
const slow = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

async function api(path, opts){
  const r = await fetch(path, opts);
  let j = {}; try { j = await r.json(); } catch(e){}
  if(!r.ok && !j.error && !j.ok) j.error = j.error || ('요청 실패 ('+r.status+')');
  return j;
}
const post = (p, body) => api(p, {method:'POST', headers:{'Content-Type':'application/json'},
                                 body:JSON.stringify(body)});

/* ---------------- Hebi ----------------
   실존 버추얼 유튜버의 캐릭터 디자인을 쓰지 않는다. 이름(へび=뱀)만 빌린 오리지널이다. */
function hebiSVG(state){
  const E = {
    idle:  '<circle cx="42" cy="41" r="4.6" fill="#101010"/><circle cx="43.7" cy="39.3" r="1.7" fill="#fff"/>'+
           '<circle cx="58" cy="41" r="4.6" fill="#101010"/><circle cx="59.7" cy="39.3" r="1.7" fill="#fff"/>',
    working:'<circle cx="42" cy="41" r="4.6" fill="#101010"/><circle cx="43.9" cy="39.6" r="1.5" fill="#fff"/>'+
           '<circle cx="58" cy="41" r="4.6" fill="#101010"/><circle cx="59.9" cy="39.6" r="1.5" fill="#fff"/>'+
           '<path d="M33 31 l7 3M67 31 l-7 3" stroke="#101010" stroke-width="2" stroke-linecap="round"/>',
    happy: '<path d="M37 43 q5 -7 10 0M53 43 q5 -7 10 0" stroke="#101010" stroke-width="2.6" '+
           'fill="none" stroke-linecap="round"/>',
    sleep: '<path d="M37 42 h10M53 42 h10" stroke="#101010" stroke-width="2.4" stroke-linecap="round"/>'+
           '<text x="72" y="26" font-size="11" fill="#888" font-weight="700">z</text>'+
           '<text x="80" y="17" font-size="8" fill="#888" font-weight="700">z</text>',
  }[state] || '';
  const M = {
    idle:  '<path d="M46 51 q4 4 8 0" stroke="#101010" stroke-width="2" fill="none" stroke-linecap="round"/>',
    working:'<path d="M45 52 h10" stroke="#101010" stroke-width="2" stroke-linecap="round"/>',
    happy: '<ellipse cx="50" cy="53" rx="6" ry="4.6" fill="#101010"/>'+
           '<ellipse cx="50" cy="55" rx="3.4" ry="2.4" fill="var(--hebi-blush)"/>',
    sleep: '<path d="M47 52 q3 2 6 0" stroke="#101010" stroke-width="1.8" fill="none" stroke-linecap="round"/>',
  }[state] || '';
  return '<svg viewBox="0 0 100 100" aria-hidden="true">'+
    '<path d="M28 90 q-10 0 -10 -9 t10 -9 h30 q9 0 9 -8 t-9 -8 h-14" fill="none" '+
      'stroke="var(--hebi)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<path d="M28 90 q-10 0 -10 -9 t10 -9 h30" fill="none" stroke="var(--hebi-2)" '+
      'stroke-width="4" stroke-linecap="round" opacity=".65"/>'+
    '<path d="M50 17 l-7 10 h14 z" fill="var(--hebi-deep)"/>'+
    '<ellipse cx="50" cy="41" rx="22" ry="19.5" fill="var(--hebi)"/>'+
    '<ellipse cx="50" cy="49" rx="13" ry="9" fill="var(--hebi-2)" opacity=".9"/>'+
    '<ellipse cx="30" cy="48" rx="4.6" ry="2.9" fill="var(--hebi-blush)" opacity=".75"/>'+
    '<ellipse cx="70" cy="48" rx="4.6" ry="2.9" fill="var(--hebi-blush)" opacity=".75"/>'+
    E + M +
    '<path d="M50 58 v6 M50 64 l-3.5 3.5 M50 64 l3.5 3.5" stroke="var(--hebi-blush)" '+
      'stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>';
}

// Hebi 얼굴은 여기서만 고른다. 넣어둔 이미지 > 봇 아바타 > 내장 SVG.
// 봇 아바타가 곧 Hebi 라서, 따로 넣은 게 없으면 그걸 그대로 쓴다.
function hebiFace(state){
  if((ME.mascot||[]).includes(state)) return '<img alt="Hebi" src="/mascot/'+state+'">';
  if(ME.icon) return '<img alt="Hebi" src="'+ME.icon+'">';
  return hebiSVG(state);
}

let hebiState = 'idle';
function hebi(state, line){
  hebiState = state || hebiState;
  const box = $('#hebi');
  box.className = 'hebiart ' + (hebiState==='working' ? 'spin' : 'bob');
  box.innerHTML = hebiFace(hebiState);
  if(line) $('#say').textContent = line;
}
const say = (line, state) => hebi(state, line);

function idleLine(){
  if(!ME.bot_ready) return '봇이 자는 중이야... start.bat 좀 눌러줘!';
  if(!ME.account)   return '먼저 에이전트 계정부터 연결하자!';
  if(!ME.linked)    return '디스코드 연동만 하면 준비 끝이야!';
  return '준비 완료! 뭐부터 볼까?';
}

/* ---------------- 사이드바 ---------------- */
function allowed(key){ const p = PAGES[key]; return p && (!p.mgr || ME.is_manager); }

function navlink(key, cur){
  const p = PAGES[key];
  const a = el('a','navlink'+(key===cur?' on':''), p.icon+'<span class="lbl">'+esc(p.label)+'</span>');
  a.href = '#'+key; a.title = p.label;
  return a;
}

function nav(){
  let cur = (location.hash||'#chat').slice(1);
  if(!allowed(cur)) cur = 'chat';
  const box = $('#nav'); box.textContent='';
  for(const item of NAV){
    if(typeof item === 'string'){
      if(!allowed(item)) continue;
      box.appendChild(navlink(item, cur));
      continue;
    }
    const kids = item.items.filter(allowed);
    if(!kids.length || (item.mgr && !ME.is_manager)) continue;
    const holds = kids.includes(cur);
    const open = holds || pref('open.'+item.id) === '1';
    const g = el('div','navgroup'+(open?' open':''));
    const head = el('button','navlink'+(holds?' on':''),
      item.icon+'<span class="lbl">'+esc(item.label)+'</span>'+
      '<span class="caret">'+ICON.right+'</span>');
    head.title = item.label;
    head.onclick = ()=>{
      // 레일 모드에선 접을 자리가 없으니 첫 항목으로 바로 간다
      if($('#app').classList.contains('rail')){ location.hash = '#'+kids[0]; return; }
      const now = g.classList.toggle('open');
      pref('open.'+item.id, now ? '1' : '');
    };
    g.appendChild(head);
    const subnav = el('div','subnav');
    for(const k of kids){
      const p = PAGES[k];
      const a = el('a', k===cur?'on':'', p.icon+'<span>'+esc(p.label)+'</span>');
      a.href = '#'+k; subnav.appendChild(a);
    }
    g.appendChild(subnav);
    box.appendChild(g);
  }
  const p = PAGES[cur];
  $('#ttl').textContent = p.title; $('#sub').textContent = p.sub;
  $('#main').classList.toggle('full', !!p.full);
  return cur;
}

$('#toggle').innerHTML = ICON.chevron;
$('#toggle').onclick = ()=>{
  const on = $('#app').classList.toggle('rail');
  pref('rail', on ? '1' : '');
  $('#toggle').title = on ? '사이드바 펼치기' : '사이드바 접기';
  nav();
};
if(pref('rail')) $('#app').classList.add('rail');

/* ---------------- 부팅 · 실시간 ---------------- */
async function boot(rerender){
  ME = await api('/api/me');
  REV = ME.rev;
  const rows = [];
  rows.push('<span class="dot '+(ME.bot_ready?'live':'off')+'"></span>'+
            (ME.bot_ready?'봇 실행 중':'봇 꺼짐'));
  rows.push(ME.linked ? '<span class="ok">'+esc(ME.user_name)+'</span> 연동됨'
            : (ME.user_name ? '<span class="warn">'+esc(ME.user_name)+'</span> 재연동 필요'
                            : '<span class="warn">미연동</span>'));
  if(ME.account) rows.push(esc(ME.account.identity));
  $('#who').innerHTML = rows.join('<br>');
  if(ME.icon){
    const g = $('#logo');
    if(!g.classList.contains('img')){
      const i = el('img'); i.src = ME.icon; i.alt='';
      g.textContent=''; g.appendChild(i); g.classList.add('img');
      const f = el('link'); f.rel='icon'; f.href=ME.icon; document.head.appendChild(f);
    }
  }
  const b = $('#banner');
  if(!ME.bot_ready){ b.style.display='block';
    b.textContent = '봇이 실행 중이 아닙니다. start.bat 으로 실행하면 수집 관리와 대화 수집이 동작합니다.'; }
  else b.style.display='none';
  if(!BUSY) hebi(ME.bot_ready?'idle':'sleep', idleLine());
  if(rerender !== false) route();
  watch();
  askWatch();          // 새로고침 전에 돌던 묻기를 이어받는다
}

async function tick(){
  // 답변을 기다리는 중이면 다시 그리지 않는다 — 그리면 진행 중인 요청이 날아간다
  if(BUSY) return;
  const s = await api('/api/state');
  if(s.rev && s.rev !== REV){ REV = s.rev; await boot(); }
}
function watch(){
  if(WATCH) return;
  WATCH = setInterval(()=>{ if(!document.hidden) tick(); }, 2500);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) tick(); });
}

function route(){
  clearInterval(POLL); POLL=null;
  clearInterval(TYPING); TYPING=null;
  const cur = nav();
  pref('tab', cur);
  // 노드를 통째로 갈아끼운다. 비동기 뷰가 늦게 돌아와도 떨어져 나간 옛 노드에
  // 붙으므로 화면이 섞이지 않는다.
  const fresh = el('div'); fresh.id = 'view';
  $('#view').replaceWith(fresh);
  ({chat:viewChat, ask:viewAsk, collect:viewCollect, digest:viewDigest,
    connect:viewConnect, mcp:viewMcp, me:viewMe, board:viewBoard}[cur] || viewChat)();
}
window.addEventListener('hashchange', route);

/* ---------------- 로딩 ---------------- */
function skeleton(box, n){
  box.textContent='';
  for(let i=0;i<n;i++){
    const c = el('div','skcard');
    c.innerHTML = '<div class="sk" style="width:30px;height:30px;border-radius:50%"></div>'+
      '<div style="flex:1"><div class="sk" style="width:'+(35+i*9)+'%"></div>'+
      '<div class="sk" style="width:'+(20+i*7)+'%;height:10px;margin-top:6px;opacity:.6"></div></div>';
    box.appendChild(c);
  }
}
const busyBox = (t) => el('div','busy','<span class="spin"></span>'+esc(t));
function spinning(btn){
  if(!btn) return ()=>{};
  const old = btn.innerHTML;
  btn.disabled = true; btn.textContent=''; btn.appendChild(el('span','spin'));
  return ()=>{ btn.disabled=false; btn.innerHTML=old; };
}

/* ---------------- 대화 보기 ---------------- */
async function viewChat(){
  const v = $('#view');
  const bar = el('div','card');
  bar.innerHTML =
    '<div class="row" style="flex:1">'+
    '<select id="ch"></select>'+
    '<label class="f">부터 <input type="date" id="d1"></label>'+
    '<label class="f">까지 <input type="date" id="d2"></label>'+
    '<input type="text" id="q" placeholder="본문 검색" style="flex:1;min-width:150px">'+
    '</div>';
  const go = el('button', null); go.textContent='보기';
  const sm = el('button','ghost'); sm.textContent='정리';
  sm.title = '지금 보고 있는 기간을 요약합니다';
  bar.append(go, sm); v.appendChild(bar);

  const quick = el('div','chips');
  for(const [label, s, e] of [['오늘',today(),''],['어제',ago(1),ago(1)],
      ['최근 7일',ago(6),''],['최근 30일',ago(29),'']]){
    const c = el('span','chip', esc(label));
    c.onclick = ()=>{ $('#d1').value=s; $('#d2').value=e; load(); };
    quick.appendChild(c);
  }
  v.appendChild(quick);
  const sumBox = el('div', null); sumBox.id='sum'; v.appendChild(sumBox);
  const stream = el('div', null); stream.id='stream'; v.appendChild(stream);
  stream.appendChild(busyBox('대화를 불러오는 중...'));

  const chans = await api('/api/channels');
  const sel = $('#ch');
  if(!chans.length){
    sel.appendChild(el('option', null, '수집 중인 채널 없음'));
    stream.innerHTML = '<div class="empty">수집 중인 채널이 없습니다.'+
      (ME.is_manager?'<br><b>관리 › 수집 채널</b> 에서 켜세요.':'<br>서버 관리자에게 요청하세요.')+'</div>';
    return;
  }
  for(const c of chans){
    const o = el('option', null, '#'+esc(c.channel_name)+' · '+c.message_count);
    o.value = c.channel_id; sel.appendChild(o);
  }
  sel.value = pref('ch') || chans[0].channel_id;
  if(!sel.value) sel.value = chans[0].channel_id;
  $('#d1').value = pref('d1') || ago(6); $('#d2').value = pref('d2') || '';
  go.onclick = load; sel.onchange = load;
  $('#q').addEventListener('keydown', e => { if(e.key==='Enter') load(); });
  load();

  sm.onclick = async ()=>{
    const ch = sel.value;
    const d1 = $('#d1').value || today(), d2 = $('#d2').value || today();
    const stop = spinning(sm); BUSY++; say('읽고 정리하는 중... 좀 걸려!','working');
    sumBox.style.display='block';
    sumBox.innerHTML = '<h4><span>정리</span></h4><div class="busy">'+
      '<span class="spin"></span>대화를 읽는 중...</div>';
    const r = await post('/api/summarize', {channel:ch, date:d1, until:d2});
    if(!r.ok){ sumBox.innerHTML = '<h4><span>정리</span></h4>'+esc(r.error||'실패');
      stop(); BUSY--; say('정리할 게 없네...','idle'); return; }
    sumBox.innerHTML = '<h4><span>정리 · '+esc(r.span)+' · '+r.count+'건</span></h4>'+
      '<div class="busy"><span class="spin"></span>요약하는 중...</div>';
    clearInterval(POLL);
    POLL = setInterval(async ()=>{
      const j = await api('/api/job/'+r.id);
      if(!j.done) return;
      clearInterval(POLL); POLL=null; stop(); BUSY--;
      if(!j.ok || !j.text){
        sumBox.innerHTML = '<h4><span>정리</span></h4>'+esc((j.lines||['실패']).join(' '));
        say('정리에 실패했어...','idle'); return;
      }
      const head = el('h4');
      head.appendChild(el('span', null, '정리 · '+esc(r.span)+' · '+r.count+'건'+
        (j.llm ? ' · '+esc(j.model) : ' · 통계만')));

      cp.style.padding='4px 10px'; cp.style.fontSize='12px';

                         cp.textContent='복사됨'; setTimeout(()=>cp.textContent='복사',1500); };
      head.appendChild(cp);
      sumBox.textContent=''; sumBox.appendChild(head);
      sumBox.appendChild(el('div', null, esc(j.text)));
      say('정리 끝!','happy');
    }, 900);
  };

  async function load(){
    // 끝 날짜를 비우면 '오늘까지' 로 읽는다 (두 칸이 범위로 보이므로)
    const q = $('#q').value.trim(), ch = sel.value;
    const d1 = $('#d1').value || today(), d2 = $('#d2').value || today();
    pref('ch', ch); pref('d1', $('#d1').value); pref('d2', $('#d2').value);
    stream.textContent=''; stream.appendChild(busyBox(q?'검색하는 중...':'대화를 불러오는 중...'));
    const r = q
      ? await api('/api/search?'+new URLSearchParams({q, channel:ch, since:d1, until:d2}))
      : await api('/api/conversation?'+new URLSearchParams({channel:ch, date:d1, until:d2}));
    if(r.error){ stream.innerHTML='<div class="empty">'+esc(r.error)+'</div>'; return; }
    render(stream, r.messages||[], q);
  }
}

function render(box, msgs, q){
  box.textContent='';
  if(!msgs.length){ box.innerHTML='<div class="empty">해당 조건에 대화가 없습니다.</div>'; return; }
  msgs = msgs.slice().sort((a,b)=> a.at < b.at ? -1 : 1);
  let day='', prev='';
  for(const m of msgs){
    const d = m.at.slice(0,10);
    if(d!==day){ day=d; prev=''; box.appendChild(el('div','day', esc(d))); }
    const head = m.author !== prev;
    const row = el('div', 'msg'+(head?' head':''));
    row.appendChild(el('div','av'+(head?'':' gap'), head?esc((m.author||'?').slice(0,1)):''));
    const bod = el('div','bod');
    if(head) bod.appendChild(el('div', null,
      '<span class="nm">'+esc(m.author)+'</span><span class="tm">'+esc(m.at.slice(11,16))+'</span>'));
    let text = esc(m.content);
    if(q) text = text.replace(new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),
                              s=>'<mark>'+s+'</mark>');
    const tags = (m.thread?'<span class="tag">스레드</span>':'')
               + (m.reply_to?'<span class="tag">답장</span>':'')
               + (m.files?'<span class="tag">첨부 '+m.files+'</span>':'');
    bod.appendChild(el('div','tx', tags+text));
    row.appendChild(bod);
    const a = el('a','jump','원문 ↗'); a.target='_blank';
    a.href='https://discord.com/channels/'+m.guild_id+'/'+m.channel_id+'/'+m.id;
    row.appendChild(a);
    box.appendChild(row);
    prev = m.author;
  }
  box.scrollTop = box.scrollHeight;
}

/* ---------------- 묻기 ---------------- */
let ASKLOG = (()=>{ try { return JSON.parse(pref('asklog') || '[]'); }
                    catch(e){ return []; } })();
function saveAsk(){ try { pref('asklog', JSON.stringify(ASKLOG.slice(-40))); } catch(e){} }

// 진행 중인 묻기. 뷰 안에 두면 탭을 옮기는 순간 사라지므로 밖에 둔다.
let ASKJOB = (()=>{ try { return JSON.parse(pref('askjob') || 'null'); }
                    catch(e){ return null; } })();
let ASKPOLL = null;   // route() 가 건드리지 않는 별도 폴링
let ASKVIEW = null;   // 묻기 탭이 떠 있으면 답을 흘려 넣을 자리
function saveJob(){ try { pref('askjob', ASKJOB ? JSON.stringify(ASKJOB) : ''); } catch(e){} }

function askWatch(){
  if(ASKPOLL || !ASKJOB) return;
  BUSY++;                        // 진행 중엔 실시간 갱신이 화면을 갈아엎지 않는다
  say('생각하는 중...','working');
  ASKPOLL = setInterval(async ()=>{
    const j = await api('/api/job/'+ASKJOB.id);
    if(!j.done) return;
    clearInterval(ASKPOLL); ASKPOLL = null;
    const text = j.ok ? j.text : ((j.lines||['답을 못 받았습니다.']).join(' '));
    ASKLOG.push({role:'assistant', content:text}); saveAsk();
    ASKJOB = null; saveJob();
    BUSY--;
    // 묻기 탭이 떠 있으면 흘려 보여주고, 아니면 조용히 담아만 둔다
    if(ASKVIEW && document.contains(ASKVIEW.wait)) ASKVIEW.deliver(text, j.ok);
    else say(j.ok ? '답 다 썼어! 묻기 탭에서 봐' : '잘 안 됐어...', j.ok?'happy':'idle');
  }, 900);
}

      '묻고 시키는 일은 연결한 <b>클로드</b>나 <b>코덱스</b>가 대신합니다.<br>'+
      '설정 · 계정 연결에서 붙인 뒤 다시 오세요.</div>';

  }
  const thread = el('div', null); thread.id='thread'; v.appendChild(thread);
  const quick = el('div','quick'); v.appendChild(quick);

  const comp = el('div','composer');
  const ta = el('textarea'); ta.rows = 1;
  ta.placeholder = '무엇이든 물어보세요';
  const tools = el('div','ctoolbar');
  const sel = el('select');
  const a1 = el('input'); a1.type='date';
  const a2 = el('input'); a2.type='date';
  const note = el('span','hint');
  const clr = el('button','ghost'); clr.textContent='지우기';
  clr.style.padding='4px 10px'; clr.style.fontSize='12px';
  const send = el('button','sendbtn'); send.title='Enter 로 보내기';
  send.innerHTML = ICON.arrow;
  tools.append(sel, a1, el('span','hint','~'), a2, note, el('div','grow'), clr, send);
  comp.append(ta, tools); v.appendChild(comp);

  const grows = ()=>{ ta.style.height='auto'; ta.style.height = ta.scrollHeight+'px'; };
  ta.addEventListener('input', grows);

  const QUICK = [
    ['요약', '이 기간 대화를 주제별로 묶어 정리해줘.'],
    ['아이디어', '사업화 가능한 아이디어를 뽑아줘. 문제·대상 사용자·왜 지금 셋이 다 있는 것만.'],
    ['결정/미결', '결정된 것과 아직 결론이 안 난 것을 나눠서 정리해줘.'],
    ['참여', '누가 얼마나 말했고 주로 무슨 얘기를 했는지 알려줘.'],
    ['할 일', '이 대화에서 나온 할 일과 담당자를 뽑아줘. 없으면 없다고 해줘.'],
  ];
  for(const [label, q] of QUICK){
    const c = el('span','chip', esc(label));
    c.onclick = ()=>{ ta.value = q; grows(); go(); };
    quick.appendChild(c);
  }

  const chans = await api('/api/channels');
  if(!chans.length){
    thread.innerHTML = '<div class="empty">수집 중인 채널이 없습니다.</div>';
    ta.disabled = send.disabled = true; quick.textContent='';
    return;
  }
  for(const c of chans){
    const o = el('option', null, '#'+esc(c.channel_name)); o.value = c.channel_id;
    sel.appendChild(o);
  }
  sel.value = pref('ch') || chans[0].channel_id;
  if(!sel.value) sel.value = chans[0].channel_id;
  a1.value = pref('d1') || ago(6); a2.value = pref('d2') || '';
  const remember = ()=>{ pref('ch', sel.value); pref('d1', a1.value); pref('d2', a2.value); };
  sel.onchange = a1.onchange = a2.onchange = remember;
  clr.onclick = ()=>{ ASKLOG=[]; saveAsk(); draw(); };

  draw(); ta.focus();
  ta.addEventListener('keydown', e=>{
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); go(); }
  });
  send.onclick = go;

  // 다른 탭에 다녀오는 사이에도 요청은 계속 돈다 — 돌아오면 그대로 이어 보여준다
  if(ASKJOB){
    note.textContent = (ASKJOB.span||'') + ' · ' + (ASKJOB.count||0) + '건';
    hook(thinking('생각하는 중'));
    send.disabled = ta.disabled = true;
    askWatch();
  }

  function mark(){
    const m = el('div','mark');
    m.innerHTML = hebiFace('idle');
    return m;
  }

  function draw(){
    thread.textContent='';
    if(!ASKLOG.length){
      thread.innerHTML = '<div class="empty"><div class="hebihero">'+hebiFace('idle')+'</div>'+
        '고른 채널과 기간의 대화를 자료로 놓고 답합니다.<br>'+
        '자료에 없으면 없다고 말합니다.</div>';
      return;
    }
    for(const m of ASKLOG){
      const t = el('div','turn'+(m.role==='user'?' me':' hebi'));
      if(m.role !== 'user') t.appendChild(mark());
      t.appendChild(el('div','body', esc(m.content)));
      thread.appendChild(t);
    }
    thread.scrollTop = thread.scrollHeight;
  }

  function thinking(label){
    const t = el('div','turn hebi');
    t.appendChild(mark());
    const b = el('div','body');
    b.innerHTML = '<span style="color:var(--muted-foreground)">'+esc(label)+
      '</span> <span class="think"><i></i><i></i><i></i></span>';
    t.appendChild(b); thread.appendChild(t); thread.scrollTop = thread.scrollHeight;
    return t;
  }

  // 답변을 한 번에 붙이지 않고 흘려 보여준다. 긴 답은 더 빨리 흐른다.
  function typeOut(node, text, done){
    if(slow()){ node.textContent = text; done && done(); return; }
    const step = Math.max(1, Math.round(text.length / 220));
    const caret = el('span','caret2');
    let i = 0;
    clearInterval(TYPING);
    TYPING = setInterval(()=>{
      i = Math.min(text.length, i + step);
      node.textContent = text.slice(0, i);
      node.appendChild(caret);
      thread.scrollTop = thread.scrollHeight;
      if(i >= text.length){ clearInterval(TYPING); TYPING=null; caret.remove(); done && done(); }
    }, 16);
  }

  // 답이 오면 흘려 넣을 자리를 askWatch 에게 알려준다
  function hook(wait){
    ASKVIEW = { wait, deliver(text, ok){
      const body = wait.querySelector('.body');
      body.textContent = '';
      typeOut(body, text, ()=>{
        send.disabled = ta.disabled = false; ta.focus();
        say(ok?'답했어!':'잘 안 됐어...', ok?'happy':'idle');
      });
    }};
  }

  async function go(){
    const q = ta.value.trim();
    if(!q || send.disabled) return;
    remember();
    ASKLOG.push({role:'user', content:q}); saveAsk();
    ta.value=''; grows(); draw();
    send.disabled = ta.disabled = true;
    say('읽는 중...','working');
    const wait = thinking('대화를 읽는 중');
    const d1 = a1.value || today(), d2 = a2.value || today();
    const r = await post('/api/chat', {channel: sel.value, date: d1, until: d2, messages: ASKLOG});
    if(!r.ok){
      wait.remove(); ASKLOG.push({role:'assistant', content: r.error || '실패했습니다.'});
      saveAsk(); draw();
      send.disabled = ta.disabled = false; ta.focus();
      say('그건 못 하겠어...','idle'); return;
    }
    note.textContent = r.span + ' · ' + r.count + '건';
    wait.querySelector('.body').innerHTML =
      '<span style="color:var(--muted-foreground)">생각하는 중</span> '+
      '<span class="think"><i></i><i></i><i></i></span>';
    ASKJOB = {id: r.id, span: r.span, count: r.count}; saveJob();
    hook(wait);
    askWatch();
  }
}

  rt.appendChild(rr); box.appendChild(rt);
}

/* ---------------- 계정 연결 ---------------- */
function svc(key, label){
  const w = el('div','svc');
  const i = el('img'); i.src = '/icon/'+encodeURIComponent(key); i.alt = '';
  i.onerror = ()=>{ w.textContent = (label||key).slice(0,1).toUpperCase(); w.classList.add('letter'); };
  w.appendChild(i);
  return w;
}
function lead(key, label, html){
  const d = el('div','lead');
  d.appendChild(svc(key, label)); d.appendChild(el('div', null, html));
  return d;
}

async function viewConnect(){
  const v = $('#view');
  v.appendChild(el('h2', null, '에이전트 계정'));
  const accBox = el('div', null); v.appendChild(accBox); skeleton(accBox, 2);
  const addBox = el('div', null); v.appendChild(addBox);

  v.appendChild(el('h2', null, '디스코드 연동'));
  const pair = el('div','card');
  pair.innerHTML = '<div><div class="who">연동 코드</div>'+
    '<div class="meta">디스코드에서 <b>/시작</b> — 링크로 들어오면 자동으로 채워집니다</div></div>';
  const pin = el('input'); pin.type='text'; pin.placeholder='ABC123';
  pin.maxLength=6; pin.autocomplete='off'; pin.style.width='110px';
  const pb = el('button', null); pb.textContent='연동';
  pair.appendChild(el('div','row')).append(pin, pb);
  v.appendChild(pair);
  const pmsg = el('div','meta'); v.appendChild(pmsg);
  const log = el('div','log'); v.appendChild(log);

  const accts = await api('/api/accounts');
  accBox.textContent='';
  if(!accts.length) accBox.appendChild(el('div','card','<div class="meta">등록된 계정이 없습니다. 아래에서 연결하세요.</div>'));
  for(const a of accts){
    const card = el('div','card');
    card.appendChild(lead(a.agent, AG[a.agent]||a.agent,
      '<div class="who">'+esc(a.identity)+' '+
      (a.linked?'<span class="badge g">연동됨</span>':'<span class="badge y">미연동</span>')+'</div>'+
      '<div class="meta">'+esc(AG[a.agent]||a.agent)+' · 이 PC에 저장됨, 다시 로그인할 필요 없습니다</div>'));
    const b = el('button','ghost'); b.textContent='연결 해제';
    b.onclick = async ()=>{ if(!confirm('이 계정 연결을 해제할까요?')) return;
      await post('/api/unlink', {home:a.home}); boot(); };
    card.appendChild(b); accBox.appendChild(card);
  }
  addBox.textContent='';
  for(const [k,label] of Object.entries(AG)){
    const card = el('div','card');
    card.appendChild(lead(k, label, '<div class="who">'+esc(label)+' 계정 추가</div>'+
      '<div class="meta">로그인 창이 열립니다'+
      (k==='claude'?' · 연결되면 이 프로젝트 MCP가 자동으로 붙습니다':'')+'</div>'));
    const b = el('button', null); b.textContent='연결';
    b.onclick = ()=>login(k, log, b);   // 팝업은 클릭 안에서 열어야 차단되지 않는다
    card.appendChild(b); addBox.appendChild(card);
  }

  if(PRESET) pin.value = PRESET;
  pb.onclick = async ()=>{
    if(!accts.length){ pmsg.innerHTML='<span class="warn">먼저 에이전트 계정을 연결하세요.</span>'; return; }
    if(!pin.value.trim()){ pmsg.innerHTML='<span class="warn">코드를 입력하세요.</span>'; return; }
    pmsg.innerHTML='<span class="spin"></span> 연동 중...';
    BUSY++; say('연동하는 중...','working');
    const r = await post('/api/discord-link', {code:pin.value.trim(), home:accts[0].home});
    BUSY--;
    pmsg.innerHTML = r.ok ? '<span class="ok">'+esc(r.user_name)+' 님으로 연동됐습니다.</span>'
                          : '<span class="warn">'+esc(r.error||'연동 실패')+'</span>';
    say(r.ok ? esc(r.user_name)+' 님, 반가워!' : '코드가 안 맞아...', r.ok?'happy':'idle');
    if(r.ok){ pin.value=''; boot(); }
  };
}

async function login(agent, log, btn){
  // 클릭 제스처 안에서 빈 창을 먼저 연다. URL 은 나중에 채운다 (팝업 차단 회피)
  const w = window.open('', 'hebi-login', 'width=560,height=760');
  if(w) w.document.write('<title>로그인</title><body style="font:15px system-ui;padding:40px;'+
    'text-align:center;color:#666">로그인 페이지를 여는 중...</body>');
  const stop = spinning(btn);
  log.style.display='block'; log.textContent='로그인 창을 여는 중...';
  BUSY++; say('로그인 창 띄울게!','working');
  const {id} = await post('/api/link/'+agent, {});
  clearInterval(POLL); let opened=false;
  POLL = setInterval(async ()=>{
    const j = await api('/api/job/'+id);
    log.textContent = (j.lines||[]).join('\n') || '진행 중...';
    if(j.url && !opened){
      opened = true;
      if(w && !w.closed) w.location.href = j.url;
      const a = el('a','big','로그인 창이 안 뜨면 여기를 누르세요');
      a.href=j.url; a.target='hebi-login';
      log.appendChild(el('br')); log.appendChild(a);
    }
    if(j.done){ clearInterval(POLL); POLL=null; stop(); BUSY--;
      if(w && !w.closed && j.ok) try{ w.close(); }catch(e){}
      log.append(j.ok?'\n\n연결 완료: '+j.identity:'\n\n연결에 실패했습니다.');
      say(j.ok?'연결됐어! 이제 안 물어볼게':'로그인이 안 끝났어...', j.ok?'happy':'idle');
      boot();
    }
    log.scrollTop = log.scrollHeight;
  }, 700);
}

/* ---------------- MCP ---------------- */
async function viewMcp(){
  const v = $('#view');
  v.appendChild(el('div','meta','기본 제공 항목은 주소를 입력할 필요가 없습니다. 인증이 필요하면 창이 열립니다.'));
  const box = el('div', null); box.style.marginTop='10px'; v.appendChild(box);

  v.appendChild(el('h2', null, '온디맨드 — 목록에 없는 MCP'));
  const od = el('div','card');
  od.innerHTML = '<div class="row" style="flex:1">'+
    '<input type="text" id="mn" placeholder="이름 (예: my-server)" style="width:165px">'+
    '<input type="text" id="mu" placeholder="http://127.0.0.1:3845/mcp 또는 https://..." style="flex:1;min-width:200px">'+
    '</div>';
  const ob = el('button','ghost'); ob.textContent='추가'; od.appendChild(ob); v.appendChild(od);
  const log = el('div','log'); v.appendChild(log);
  ob.onclick = ()=> mcpDo('/api/mcp/add', {name:$('#mn').value, url:$('#mu').value}, log, ob);

  box.appendChild(busyBox('연결 상태 확인 중...'));
  const r = await api('/api/mcp');
  const have = new Set(r.servers||[]);
  box.textContent='';
  const items = [[SELFMCP.name, SELFMCP.label, SELFMCP.desc, true],
    ...Object.entries(CATALOG).map(([k,v2])=>[k, v2.label, v2.desc, false])];
  for(const [key,label,desc,isSelf] of items){
    const on = have.has(key);
    const card = el('div','card');
    card.appendChild(lead(key, label, '<div class="who">'+esc(label)+
      (on?' <span class="badge g">연결됨</span>':'')+'</div><div class="meta">'+esc(desc)+
      (isSelf?' · 자동':'')+'</div>'));
    const b = el('button','ghost'); b.textContent = on?'해제':'연결';
    b.onclick = ()=> on ? mcpDo('/api/mcp/remove', {name:key}, log, b)
                        : mcpDo('/api/mcp/add', {key}, log, b);
    card.appendChild(b); box.appendChild(card);
  }
  for(const name of (r.servers||[]))
    if(!CATALOG[name] && name!==SELFMCP.name){
      const card = el('div','card');
      card.appendChild(lead(name, name, '<div class="who">'+esc(name)+
        ' <span class="badge g">연결됨</span></div><div class="meta">직접 추가함</div>'));
      const b = el('button','ghost'); b.textContent='해제';
      b.onclick = ()=> mcpDo('/api/mcp/remove', {name}, log, b);
      card.appendChild(b); box.appendChild(card);
    }
  if(r.note) box.appendChild(el('div','meta', esc(r.note)));
}

async function mcpDo(path, body, log, btn){
  const stop = spinning(btn);
  log.style.display='block'; log.innerHTML='처리 중...<div class="prog"><i></i></div>';
  BUSY++; say('MCP 붙이는 중...','working');
  const r = await post(path, body);
  BUSY--; stop();
  log.textContent = (r.output || r.error || '') +
    (r.ok ? '\n\n완료. 처음 쓸 때 브라우저에서 로그인하라고 나올 수 있습니다.' : '\n\n실패했습니다.');
  say(r.ok?'붙였어!':'잘 안 됐어...', r.ok?'happy':'idle');
  viewMcp();
}

/* ---------------- 리더보드 ---------------- */
async function viewBoard(){
  const v = $('#view');
  const bar = el('div','card');
  bar.innerHTML='<div class="row" style="flex:1"><span class="meta">채널</span></div>';
  const sel = el('select'); bar.querySelector('.row').appendChild(sel); v.appendChild(bar);
  const chips = el('div','chips'); v.appendChild(chips);
  const out = el('div', null); v.appendChild(out); skeleton(out, 4);

  let period = pref('period') || '7';
  for(const [k,label] of [['7','최근 7일'],['30','최근 30일'],['all','전체']]){
    const c = el('span','chip'+(k===period?' on':''), esc(label));
    c.onclick = ()=>{ period=k; pref('period',k); [...chips.children].forEach(x=>x.className='chip');
      c.className='chip on'; load(); };
    chips.appendChild(c);
  }
  const all = el('option', null, '전체 채널'); all.value=''; sel.appendChild(all);
  for(const c of await api('/api/channels')){
    const o = el('option', null, '#'+esc(c.channel_name)); o.value=c.channel_id; sel.appendChild(o);
  }
  sel.onchange = load;
  load();

  async function load(){
    const r = await api('/api/leaderboard?'+new URLSearchParams({days:period, channel:sel.value}));
    if(!r.rows || !r.rows.length){
      out.innerHTML='<div class="empty">아직 수집된 대화가 없습니다.</div>'; return; }
    const max = r.rows[0].messages;
    out.innerHTML = '<table><thead><tr><th class="rank">순위</th><th>이름</th>'+
      '<th class="n">메시지</th><th class="n">활동일</th><th class="n">채널</th></tr></thead><tbody>'+
      r.rows.map((x,i)=>{
        const rk = i<3 ? '<span class="medal m'+(i+1)+'">'+(i+1)+'</span>' : (i+1);
        return '<tr><td class="rank">'+rk+'</td><td>'+esc(x.author)+
          '<div class="bar"><i style="width:'+Math.max(3,Math.round(x.messages/max*100))+'%"></i></div></td>'+
          '<td class="n">'+x.messages+'</td><td class="n">'+x.days+'</td>'+
          '<td class="n">'+x.channels+'</td></tr>';
      }).join('')+'</tbody></table>';
    say(r.rows[0].author+' 님이 1등이야!','happy');
    setTimeout(()=>{ if(!BUSY) hebi('idle', idleLine()); }, 2800);
  }
}
